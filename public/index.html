<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCSources0's Admin Dashboard</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="sidebar fill">
    <button title="Server" class="server"><span class="fill">home</span></button>
    <button title="Options" class="options"><span class="fill">settings</span></button>
    <button title="Console" class="console"><span class="fill">code_blocks</span></button>
    <button title="Mods" class="mods" focus><span class="fill">build</span></button>
    <button title="Files" class="files"><span class="fill">folder_open</span></button>
  </div>
  <main class="server">
    <div class="run-control">
      <button title="Start" class="start" onclick="server.flip()"><span class="fill">play_arrow</span></button>
      <div class="loading hidden"><span class="fill rotate">progress_activity</span></div>
      <button title="Stop" class="stop hidden" onclick="server.flip()"><span class="fill">stop</span></button>
      <button title="Settings" class="settings" onclick="toggleQuickSettings()"><span class="fill">settings</span></button>
    </div>
    <button title="Copy" id="copy">ncsources0.ddns.net</button> <br>
    <a href="serverPack.mrpack"></a> <br>
    [Players Online] <br>
    
  </main>
  <main class="options carousel">
    <header class="icon">
      <button title="Properties Selected" class="properties selected"><span>dns</span></button>
      <button title="Whitelist" class="whitelist"><span>gate</span></button>
      <button title="Operators" class="ops"><span>shield_person</span></button>
      <button title="Banned" class="banned"><span>block</span></button>
    </header>
    <div class="properties selected">
      
    </div>
    <div class="whitelist">
      
    </div>
    <div class="ops">

    </div>
    <div class="banned">
      This section must have one button. if the input contains "." ban an ip.
    </div>
  </main>

  <main class="console carousel">
    <header class="icon">
      <button title="Console" class="console"><span>terminal</span></button>
      <button title="Chat" class="chat"><span>chat</span></button>
    </header>
    [console, chat]
  </main>

  <main class="mods" focus>
    <div class="search">
      <input type="text">
      <button class="online icon">cloud</button>
    </div>
    <div class="projects"></div>
  </main>

  <main class="files">
    <button class="file fill">folder</button>
    <button class="file fill">draft</button>
    <button class="file fill">local_cafe</button>
    <button class="file fill">description</button>
    <button class="file fill">edit_document</button>
    <button class="file fill">edit_document</button>
    <button class="file fill">edit_document</button>
    <button class="file fill">file_json</button>
    <button class="file fill">file_png</button>
    <button class="file fill">csv</button>
  </main>

  <div class="status"></div>
  <div class="quick-settings">
    <div>
      <table>
        Fuck you, ts don't work.
        <tr>
          <th>MOTD:</th>
          <th><input name="motd"></th>
        </tr>
        <tr>
          <th>World:</th>
          <th><input name="level-name"></th>
        </tr>
        <tr>
          <th>Online:</th>
          <th><input name="online-mode"></th>
        </tr>
        <tr>
          <th>Server Name:</th>
          <th><input name="motd"></th>
        </tr>
      </table>
      <button class="close" onclick="toggleQuickSettings()"><span class="icon">close</span></button>
    </div>
  </div>
  <script src="script.js"></script>
  <script src="formatting.js"></script>
  <script src="fileExplorer.js"></script>
  <script src="modExplorer.js"></script>
</body>
</html>
